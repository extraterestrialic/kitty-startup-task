name: System Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and start containers
      run: docker compose up -d --build

    - name: Wait for services to be ready
      run: sleep 15

    - name: Check Frontend (Nginx)
      run: |
        status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
        if [ "$status_code" -ne 200 ]; then
          echo "Ошибка: Фронтенд вернул код $status_code"
          exit 1
        fi
        echo "Фронтенд работает отлично!"

    - name: Check Backend API
      run: |
        # Делаем запрос к API. 
        status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/)
        
        # 502 и 504 означают, что бэкенд умер или не отвечает.
        # Любой другой код (200, 404, 405) означает, что бэкенд жив и общается через сокеты!
        if [ "$status_code" -eq 502 ] || [ "$status_code" -eq 504 ]; then
          echo "Ошибка: Бэкенд недоступен (код $status_code)"
          exit 1
        fi
        echo "Бэкенд работает отлично! (вернул код $status_code)"

    - name: Print Docker Logs (if failed)
      if: failure()
      run: docker compose logs

    - name: Stop containers
      if: always()
      run: docker compose down
